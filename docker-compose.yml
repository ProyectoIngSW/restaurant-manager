services:
  database:
    image: postgres:15-alpine
    container_name: restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: restaurant123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    image: restaurant-manager:compose
    container_name: restaurant-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: restaurant
      DB_USER: postgres
      DB_PASSWORD: restaurant123
      JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    networks:
      - restaurant-network

volumes:
  postgres-data:
    driver: local

networks:
  restaurant-network:
    driver: bridge
