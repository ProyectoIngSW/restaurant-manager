name: CI/CD Pipeline Completo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: "-Xmx1024m"

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================
  # JOB 1: BUILD Y COMPILACIÓN
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Compilar con Maven
        run: mvn clean compile -B
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: target/classes
          retention-days: 1
  # ============================================
  # JOB 2: TESTS UNITARIOS
  # ============================================
  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn test -B
      - run: mvn jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 5
      - if: ${{ github.event_name == 'pull_request' }}
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          
  # ============================================
  # JOB 3: TESTS DE INTEGRACIÓN
  # ============================================
  integration-tests:
    name: Tests de Integración
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Ejecutar tests de integración
        run: mvn verify -DskipUnitTests
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/
          retention-days: 5

  # ============================================
  # JOB 4: CODE QUALITY
  # ============================================
  code-quality:
    name: Análisis de Calidad
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Ejecutar Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 5
          
  # ============================================
  # JOB 5: SECURITY SCAN
  # ============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: restaurant-manager
          path: .
          format: HTML
          out: reports
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/
          retention-days: 5
          
# ============================================
  # JOB 6: BUILD ARTIFACT (solo en main)
  # ============================================
  build-artifact:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, code-quality, security-scan]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "ref=${{ github.ref }} | event=${{ github.event_name }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Obtener versión
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Crear JAR
        run: mvn -B -DskipTests package
      - name: Localizar JAR
        id: locate
        run: |
          JAR=$(ls target/*.jar | head -n1)
          test -n "$JAR" && echo "JAR=$JAR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-manager-jar-${{ steps.version.outputs.VERSION }}
          path: ${{ steps.locate.outputs.JAR }}
          retention-days: 30
      - run: ls -lh target/*.jar

 # ============================================
  # JOB 7: DEPLOY TO STAGING (solo en main)
  # ============================================
  deploy-staging:
    name: Deploy a Staging
    runs-on: ubuntu-latest
    needs: build-artifact
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: https://staging.restaurant-manager.example.com
    steps:
      - run: echo "ref=${{ github.ref }} | event=${{ github.event_name }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: restaurant-manager-jar-*
          merge-multiple: true
          path: .
      - id: got
        run: |
          JAR=$(find . -maxdepth 3 -name "*.jar" | head -n1)
          test -n "$JAR" && echo "JAR=$JAR" >> "$GITHUB_OUTPUT" || (echo "No hay JAR" && exit 1)
      - name: Simular deploy a staging
        run: |
          echo "Deployando a staging..."
          echo "Artifact: ${{ steps.got.outputs.JAR }}"
          echo "URL: https://staging.restaurant-manager.example.com"
      - name: Smoke tests
        run: |
          echo "Servidor responde: OK"
          echo "Health check: OK"
          echo "Endpoints: OK"
          
# ============================================
  # JOB 8: NOTIFICACIONES
  # ============================================
  notify:
    name: Notificaciones
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, code-quality, security-scan]
    if: ${{ always() }}
    steps:
      - name: Resumen
        run: |
          echo "Unit:  ${{ needs.unit-tests.result }}"
          echo "IT:    ${{ needs.integration-tests.result }}"
          echo "Qual:  ${{ needs.code-quality.result }}"
          echo "Sec:   ${{ needs.security-scan.result }}"

      - name: Pipeline Exitoso
        if: ${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
        run: echo "Pipeline completado exitosamente"

      - name: Pipeline con Warnings
        if: ${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && (needs.code-quality.result == 'failure' || needs.security-scan.result == 'failure') }}
        run: echo "Tests OK, revisar calidad o seguridad" || true

      - name: Pipeline Fallido
        if: ${{ needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' }}
        run: |
          echo "Pipeline falló"
          exit 1
